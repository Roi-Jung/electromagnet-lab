<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전자석 연구소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#FFF8EC;--grid:rgba(27,35,64,.05);--ink:#1B2340;--ink2:#5A6280;--line:#E3D9C4;--yel:#FFC83D;--yel2:#FFF0C2;--blue:#2F6BFF;--blue2:#E2EAFF;--red:#F0533D;--red2:#FFE3DD;--grn:#1FA86B;--grn2:#D9F5E8;--pur:#7B5CFF;--pur2:#ECE6FF}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button{font:inherit;color:inherit}
#hud{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
#hud[hidden]{display:none}
.hbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;padding:8px 12px;color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.hbtn:active{transform:scale(.96)}
.hname{font-size:16px}
.rank{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:var(--pur);font-size:13px;font-weight:700}
.hsp{flex:1}
.coins{background:var(--yel);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:800;font-size:15px}
.coins.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
main{max-width:1000px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.3}
h2{font-size:20px;margin:0 0 10px}
.mtag{display:inline-block;background:var(--ink);color:var(--yel);font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px}
.mhead{margin-bottom:8px}
.btn{font-weight:800;font-size:16px;padding:12px 18px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--yel)}.btn.b{background:var(--blue);color:#fff}.btn.g{background:var(--grn);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.p{background:var(--pur);color:#fff}
.btn.sm{font-size:14px;padding:8px 12px;box-shadow:0 3px 0 var(--ink)}
.switch{width:100%;font-size:21px;padding:16px;margin-top:12px}
.switch.on{background:var(--ink);color:var(--yel)}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--ink);margin-bottom:14px}
.mt{margin-top:16px}
.lbl{font-weight:800;font-size:15px;margin-bottom:8px}
.hint{color:var(--ink2);font-size:14px;line-height:1.5}
.q{font-weight:700;margin:2px 0 10px;line-height:1.5}
.say{display:flex;gap:10px;align-items:flex-end;margin:8px 0 14px}
.say .chuli{flex-shrink:0}
.bubble{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:18px 18px 18px 4px;padding:12px 15px;font-size:17px;line-height:1.55;font-weight:600;animation:pop .3s}
@keyframes pop{0%{transform:scale(.92);opacity:.3}100%{transform:none;opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;font-size:15px;touch-action:manipulation}
.chip.sel{background:var(--blue);color:#fff}
.chip.ok{background:var(--grn);color:#fff}
.chip.no{background:var(--red);color:#fff}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stage{background:#fff;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 5px 0 var(--ink)}
.stage svg{display:block;width:100%;height:auto}
.stage svg.chuli{display:inline-block;width:auto}
.err{color:var(--red);font-weight:800;font-size:15px;min-height:22px;margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.lock{opacity:.45}
.row>span:first-child{font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:42px;text-align:center;font-size:18px}
.sbtn{border:2px solid var(--ink);background:var(--yel2);border-radius:10px;min-width:40px;height:38px;font-weight:800;font-size:17px;cursor:pointer;padding:0 10px;touch-action:manipulation}
.sbtn.on{background:var(--ink);color:var(--yel)}
.seg{display:flex;gap:4px}
.lk{font-size:14px}
table.note{width:100%;border-collapse:collapse;font-size:14px}
table.note th{text-align:left;color:var(--ink2);font-weight:700;padding:6px 4px;border-bottom:2px solid var(--ink)}
table.note td{padding:7px 4px;border-bottom:1.5px dashed var(--line);vertical-align:top}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-weight:800;font-size:13px}
.tag.hit{background:var(--grn2);color:#0E6B42}.tag.twist{background:var(--pur2);color:#4A32B5}.tag.base{background:var(--yel2);color:#7A5200}
.check{list-style:none;margin:0;padding:0}
.check li{padding:6px 0;font-weight:700;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.check li .bx{width:22px;height:22px;flex-shrink:0;border:2px solid var(--ink);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.check li.done .bx{background:var(--grn);color:#fff}
.check li.done{color:#0E6B42}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mcard{position:relative;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-height:130px;transition:transform .08s}
.mcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mcard .mi{font-size:34px}
.mcard .mn{font-size:13px;font-weight:800;color:var(--ink2);margin-top:4px}
.mcard .mt2{font-size:18px;font-weight:800;margin-top:2px}
.mcard .ms{font-size:14px;color:var(--ink2);margin-top:2px}
.mcard.locked{background:#EFEAE0;cursor:not-allowed}
.mcard.locked .mi{filter:grayscale(1);opacity:.5}
.mcard.done{background:var(--grn2)}
.mcard.next{background:var(--yel2);animation:glowc 1.6s infinite}
@keyframes glowc{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(255,200,61,.5)}}
.mcard .st{position:absolute;top:10px;right:12px;font-size:20px}
.prog{height:16px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:var(--yel)}
textarea,input[type=text]{width:100%;font:inherit;font-size:17px;border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:#fff;color:var(--ink);resize:vertical}
textarea:focus,input:focus{outline:3px solid var(--blue);outline-offset:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btnrow .switch{flex:1;margin-top:12px}
.btnrow .btn:not(.switch){margin-top:12px}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:16px;animation:tin .35s;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.toast.coin{background:var(--yel);color:var(--ink);border:2.5px solid var(--ink)}
.toast.badge{background:var(--pur);border:2.5px solid var(--ink)}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
@keyframes tin{0%{transform:translateY(-16px) scale(.9);opacity:0}}
.confetti{position:fixed;left:50%;top:40%;pointer-events:none;z-index:55}
.confetti i{position:absolute;width:10px;height:14px;border-radius:2px;animation:conf 1.3s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{40%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--dx),calc(var(--dy) + 380px)) rotate(var(--r));opacity:0}}
.modalbg{position:fixed;inset:0;background:rgba(27,35,64,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg);border:3px solid var(--ink);border-radius:22px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 6px 0 var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.bdg .e{font-size:34px}.bdg b{display:block;margin-top:4px}.bdg small{color:var(--ink2);font-size:12px;line-height:1.4;display:block;margin-top:2px}
.bdg.no{background:#EFEAE0}.bdg.no .e{filter:grayscale(1);opacity:.35}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.clipg{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.clipg.fall{transition:transform .38s cubic-bezier(.55,0,1,.6)}
.needle{transition:transform .8s cubic-bezier(.3,1.9,.5,1)}
.flow.go{animation:flow .55s linear infinite}
.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-18}}
.fpulse{animation:fp 1.4s ease-in-out infinite}
@keyframes fp{50%{stroke-dashoffset:7}}
.puff{animation:puff 1.2s ease-out infinite}
@keyframes puff{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-28px);opacity:0}}
.fxup{animation:fxup .9s ease-out forwards}
@keyframes fxup{to{transform:translateY(-36px);opacity:0}}
.cr-mag{animation:crmag 6s ease-in-out infinite}
.cr-car{animation:crcar 6s ease-in-out infinite}
.cr-glow{animation:crglow 6s linear infinite}
.cr-on{animation:cron 6s steps(1) infinite}.cr-off{animation:croff 6s steps(1) infinite}
@keyframes crmag{0%,15%{transform:translate(0,0)}30%{transform:translate(0,-70px)}55%,75%{transform:translate(290px,-70px)}90%{transform:translate(0,-70px)}100%{transform:translate(0,0)}}
@keyframes crcar{0%,15%{transform:translate(0,0);opacity:1}30%{transform:translate(0,-70px)}55%,60%{transform:translate(290px,-70px)}68%,88%{transform:translate(290px,30px);opacity:1}92%{transform:translate(290px,30px);opacity:0}93%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}
@keyframes crglow{0%,9%{opacity:0}10%,59%{opacity:.85}60%,100%{opacity:0}}
@keyframes cron{0%{opacity:0}10%{opacity:1}60%{opacity:0}}
@keyframes croff{0%{opacity:1}10%{opacity:0}60%{opacity:1}}
.sortwrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.sortwrap{grid-template-columns:minmax(0,1fr)}}
.bin{border:2.5px dashed var(--ink);border-radius:16px;padding:10px;min-height:150px;background:#fff;cursor:pointer}
.bin h3{margin:0 0 8px;font-size:16px}
.bin.s{background:var(--yel2)}.bin.p{background:var(--red2)}.bin.e{background:var(--blue2)}
.scard{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px;margin-bottom:8px;font-weight:700;font-size:15px;line-height:1.4;cursor:pointer;touch-action:manipulation}
.scard.sel{background:var(--blue);color:#fff;transform:translateY(-2px)}
.scard.wrong{background:var(--red);color:#fff}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:12px}
.pool .scard{margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.steps span{padding:5px 11px;border-radius:10px;border:2px solid var(--ink);font-weight:700;font-size:13px;background:#fff}
.steps span.on{background:var(--ink);color:var(--yel)}
.steps span.ok{background:var(--grn2)}
.cmp{display:grid;grid-template-columns:minmax(0,1.2fr) auto;gap:8px 12px;align-items:center}
.cmp .ft{font-weight:700;padding:8px 10px;border-radius:10px}
.cmp .ft.bad{background:var(--red2)}
.sci{background:var(--blue2);border-color:var(--blue)}
.mine{background:var(--yel2)}
.overlay{position:absolute;inset:0;overflow:auto;background:rgba(255,248,236,.94);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.overlay[hidden]{display:none}
.overlay .in{max-width:460px}
.gamebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:800;margin-bottom:10px;font-size:16px}
.ebar{flex:1;min-width:120px;height:18px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.ebar i{display:block;height:100%;background:var(--grn);transition:width .1s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-top:10px;font-weight:600}
.stars{font-size:28px;letter-spacing:2px}
.hypo{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:11px 12px;margin-bottom:8px;font-weight:700;font-size:15px;cursor:pointer;line-height:1.4}
.hypo.sel{background:var(--grn2)}
.hypo.sel::before{content:"✔ ";color:var(--grn)}
.quote{background:var(--yel2);border-left:6px solid var(--yel);padding:10px 14px;border-radius:0;font-weight:600;line-height:1.5;margin:6px 0 12px}
.hero{text-align:center;padding:30px 10px}
.hero h1{font-size:42px;margin:10px 0 6px}
.hero p{font-size:18px;color:var(--ink2);line-height:1.6}
.hero .card{max-width:440px;margin:20px auto 0;text-align:left}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:13px}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header id="hud" hidden></header>
<main id="app"></main>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TEACHER=new URLSearchParams(location.search).has('teacher');

/* ---------- 저장 ---------- */
const KEY='emlab-v1';
const fresh=()=>({name:'',coins:0,badges:[],done:{},stars:{},notes:{},bestSort:0,betRuns:0,mute:false});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s?Object.assign(fresh(),s):fresh();}catch(e){return fresh();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();

/* ---------- 소리 ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,delay,f2){if(S.mute)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol){if(S.mute)return;const a=ac();if(!a)return;const len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=1800;const g=a.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const sfx={
 click:()=>tone(660,.05,'square',.05),
 on:()=>{tone(160,.3,'sawtooth',.07,0,440);},
 off:()=>tone(420,.22,'sawtooth',.06,0,110),
 snap:()=>{noise(.09,.28);tone(1600,.06,'triangle',.08);},
 coin:()=>{tone(988,.08,'square',.07);tone(1319,.28,'square',.07,.08);},
 twist:()=>{tone(300,.16,'triangle',.12,0,760);tone(760,.3,'triangle',.12,.16,1200);},
 badge:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.11,i*.1));},
 fail:()=>tone(220,.3,'sawtooth',.07,0,110),
 drop:()=>tone(320,.16,'sine',.12,0,90)
};

/* ---------- 공통 UI ---------- */
const BADGES={
 first:{icon:'⚡',name:'첫 전류',desc:'전선 옆 나침반의 비밀을 발견했어요'},
 twist:{icon:'🔄',name:'반전 발견자',desc:'예상과 다른 결과에서 새로운 걸 배웠어요'},
 fair:{icon:'⚖️',name:'공정한 실험가',desc:'한 가지 조건만 바꾸는 실험을 5번 했어요'},
 hot:{icon:'🔥',name:'과열 주의보',desc:'전선이 뜨거워지는 걸 경험했어요'},
 rule:{icon:'📐',name:'규칙 발견자',desc:'전자석의 규칙을 내 말로 정리했어요'},
 detective:{icon:'🕵️',name:'명탐정',desc:'미스터리 상자를 모두 풀었어요'},
 pole:{icon:'🧲',name:'극 마스터',desc:'전지 방향으로 극을 조종했어요'},
 sorter:{icon:'♻️',name:'선별왕',desc:'재활용 선별장에서 철을 6개 이상 골라냈어요'},
 star3:{icon:'🌟',name:'별 세 개',desc:'설계 챌린지에서 별 3개를 받았어요'},
 max:{icon:'💪',name:'최강 전자석',desc:'클립 9개를 들어 올렸어요'},
 hyp:{icon:'🃏',name:'가설 연구원',desc:'실제 실험에서 확인할 가설 카드를 만들었어요'}
};
function rank(){const c=S.coins;return c>=450?'수석 연구원':c>=280?'선임 연구원':c>=120?'연구원':'견습 연구원';}
function chuli(mood,size){size=size||64;mood=mood||'happy';
 const eyes=mood==='wow'?'<circle cx="24" cy="31" r="5" fill="#1B2340"/><circle cx="40" cy="31" r="5" fill="#1B2340"/><circle cx="26" cy="29" r="1.6" fill="#fff"/><circle cx="42" cy="29" r="1.6" fill="#fff"/>':mood==='worry'?'<path d="M19 28 L29 31 M45 28 L35 31" stroke="#1B2340" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="34" r="3" fill="#1B2340"/><circle cx="40" cy="34" r="3" fill="#1B2340"/>':'<rect x="19" y="28" width="10" height="7" rx="3.5" fill="#1B2340"/><rect x="35" y="28" width="10" height="7" rx="3.5" fill="#1B2340"/>';
 const mouth=mood==='wow'?'<ellipse cx="32" cy="45" rx="5" ry="5.5" fill="#1B2340"/>':mood==='worry'?'<path d="M24 47 Q32 41 40 47" stroke="#1B2340" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M23 42 Q32 50 41 42" stroke="#1B2340" stroke-width="3" fill="none" stroke-linecap="round"/>';

function makeEM(host){

 const q=s=>host.querySelector(s);const cg=q('.clips');const clips=[];
 const floor=i=>[250+i*36,298],att=i=>[452+(i%3)*15,172+Math.floor(i/3)*28];
 for(let i=0;i<9;i++){const g=document.createElementNS(NS,'g');g.setAttribute('class','clipg fall');g.innerHTML='<rect x="-6" y="0" width="12" height="26" rx="6" fill="none" stroke="#56607A" stroke-width="2.6"/><path d="M-2 6 V20" stroke="#56607A" stroke-width="2.2" stroke-linecap="round"/>';const[fx0,fy0]=floor(i);g.style.transform=`translate(${fx0}px,${fy0}px)`;cg.appendChild(g);clips.push(g);}

  const k=c.turns/10;let p='';for(let i=0;i<k;i++){const x=222+i*(236/(k-1));p+=`M${x.toFixed(1)} 120 L${(x+7).toFixed(1)} 180 `;}

  const W=58,G=10,tot=c.n*W+(c.n-1)*G,x0=340-tot/2;let b='';

 app.innerHTML=`<div class="mhead"><span class="mtag">미션 6 · 추리 퀴즈</span><h1>미스터리 상자 속 전자석을 추리하라!</h1></div><div id="say"></div><div id="body"></div>`;

  $$('#op .chip').forEach(c=>c.onclick=()=>{if(solved)return;const k=+c.dataset.k;if(k===p.a){solved=true;c.classList.add('ok');addCoins(tries===0?15:5,tries===0?'한 번에 추리 성공':'추리 성공');say('정답! 상자를 열어 볼게.','wow');
    const rv=$('#reveal');rv.innerHTML='<div class="stage" id="rvem"></div>';const em=makeEM($('#rvem'));const cfg=p.cfg;em.update(cfg,false,false);
    if(i===3){em.update(cfg,true,false);setTimeout(()=>{em.update({...cfg,dir:1},true,false);sfx.snap();},1100);}else setTimeout(()=>{em.update(cfg,true,false);sfx.snap();},400);
    $('#why').innerHTML=`<div class="quote">${p.why}</div><button class="btn y switch" id="nx">${i<MYS.length-1?'다음 상자 →':'미션 완료 →'}</button>`;
    $('#nx').onclick=()=>{if(i<MYS.length-1){i++;sfx.click();say('다음 상자야. 이번 것도 풀 수 있겠어?','happy');render();}else{badge('detective');finish('m6',20);}};}
   else{tries++;c.classList.add('no');sfx.fail();shake(c);setErr('다시 생각해 봐! 실험 노트에서 비슷한 조건을 찾아보자.');}});}
 say('선별장 창고에서 천으로 덮인 상자를 발견했어! 안에는 전자석이 들어 있대. 클립과 나침반을 단서로 상자 속을 추리해 봐.','wow');render();
}

/* ---------- 미션 7: 극 바꾸기 퍼즐 ---------- */
function m7(){
 const LV=[{face:'N',goal:'push',dir:-1},{face:'S',goal:'push',dir:1},{face:'N',goal:'pull',dir:1}];
 let lv=0,dir=-1,on=false,tries=0,hint=false,busy=false,done=false,tm=0,cx=400;
 app.innerHTML=`<div class="mhead"><span class="mtag">미션 7 · 밀고 당기기</span><h1>전자석의 극을 바꿔 수레를 움직여라!</h1></div><div id="say"></div>
 <div class="grid2"><div><div class="stage" id="ps"></div><div class="btnrow"><button class="btn y switch" id="sw">⚡ 스위치 켜기</button><button class="btn" id="flip">⇄ 전지 뒤집기</button></div><div class="err" id="err"></div></div><div><div class="card" id="goal"></div><div class="card"><div class="lbl">💡 기억나니?</div><div class="hint">같은 극끼리는 서로 밀어내고, 다른 극끼리는 서로 끌어당겨요. 전자석의 오른쪽 끝은 무슨 극일까요?</div><button class="btn sm" id="hb" style="margin-top:10px">🧭 나침반으로 확인하기 (보상 줄어듦)</button></div></div></div>`;
 function svg(){const L=LV[lv];const other=L.face==='N'?'S':'N';const col=p=>p==='N'?'#F0533D':'#2F6BFF';
  const W=58,x0=140-(W/2);
  return `<svg viewBox="0 0 680 300" role="img" aria-label="극 바꾸기 퍼즐"><rect width="680" height="300" fill="#F3F7FF"/>
  <path d="M70 118 V56 H270 V118" fill="none" stroke="#1B2340" stroke-width="5" stroke-linejoin="round"/><path class="flow ${on?'go':''} ${on&&dir<0?'rev':''}" d="M70 118 V56 H270 V118" fill="none" stroke="#FFC83D" stroke-width="3" stroke-dasharray="3 15" opacity="${on?1:0}"/>
  <rect x="${x0+30}" y="42" width="${W}" height="28" rx="6" fill="#FFC83D" stroke="#1B2340" stroke-width="2.5"/><rect x="${dir>0?x0+30+W:x0+25}" y="50" width="5" height="12" fill="#1B2340"/><text x="${x0+30+(dir>0?W-12:12)}" y="62" text-anchor="middle" font-size="16" font-weight="900">+</text><text x="${x0+30+(dir>0?12:W-12)}" y="62" text-anchor="middle" font-size="16" font-weight="900">−</text>
  <circle cx="70" cy="88" r="15" fill="${on?'#1FA86B':'#E1E4EC'}" stroke="#1B2340" stroke-width="2.5"/><text x="70" y="92" text-anchor="middle" font-size="10" font-weight="900" fill="${on?'#fff':'#1B2340'}">${on?'ON':'OFF'}</text>
  <rect x="34" y="112" width="18" height="64" rx="5" fill="#7D869C" stroke="#1B2340" stroke-width="2.5"/><rect x="50" y="124" width="240" height="40" rx="4" fill="#B7BFCF" stroke="#1B2340" stroke-width="2.5"/>
  <path d="${Array.from({length:12},(_,i)=>{const x=68+i*18;return `M${x} 118 L${x+7} 170`;}).join(' ')}" stroke="#C9781E" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  ${on?`<ellipse cx="170" cy="144" rx="150" ry="52" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-dasharray="7 7" class="fpulse" opacity=".6"/>`:''}
  ${hint?`<g transform="translate(320 70)"><circle r="28" fill="#fff" stroke="#1B2340" stroke-width="3"/><g transform="rotate(${dir>0?90:-90})"><path d="M0 -20 L6 0 L-6 0Z" fill="#F0533D" stroke="#1B2340" stroke-width="1.2"/><path d="M0 20 L6 0 L-6 0Z" fill="#E8ECF4" stroke="#1B2340" stroke-width="1.2"/></g><circle r="3.5" fill="#1B2340"/></g>`:''}
  <rect x="280" y="236" width="390" height="8" rx="4" fill="#C9BFA8"/><line x1="636" y1="140" x2="636" y2="236" stroke="#1B2340" stroke-width="3"/><path d="M636 140 L676 154 L636 168Z" fill="#1FA86B" stroke="#1B2340" stroke-width="2"/>
  <g id="cart" style="transition:transform ${on?'.9s cubic-bezier(.3,1.2,.5,1)':'.5s'};transform:translateX(${cx}px)"><rect x="0" y="172" width="120" height="54" rx="10" fill="#7B5CFF" stroke="#1B2340" stroke-width="3"/><circle cx="26" cy="230" r="10" fill="#1B2340"/><circle cx="94" cy="230" r="10" fill="#1B2340"/>
  <rect x="-40" y="182" width="20" height="34" fill="${col(L.face)}" stroke="#1B2340" stroke-width="2.5"/><rect x="-20" y="182" width="20" height="34" fill="${col(other)}" stroke="#1B2340" stroke-width="2.5"/><text x="-30" y="205" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">${L.face}</text><text x="-10" y="205" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">${other}</text><text x="60" y="204" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">자석 수레</text></g></svg>`;}
 function cartX(){if(!on)return 400;const rp=dir>0?'N':'S';return rp===LV[lv].face?516:332;}
 function render(){$('#ps').innerHTML=svg();const tx=cartX();if(tx!==cx){const cart=$('#cart');cx=tx;requestAnimationFrame(()=>requestAnimationFrame(()=>{cart.style.transform=`translateX(${tx}px)`;}));}const L=LV[lv];$('#goal').innerHTML=`<div class="lbl">단계 ${lv+1} / 3</div><div class="q" style="font-size:19px">${L.goal==='push'?'🏁 수레를 밀어서 깃발까지 보내라!':'🤝 수레를 끌어당겨 전자석에 붙여라!'}</div><div class="hint">수레의 전자석 쪽 면은 <b style="color:${L.face==='N'?'#F0533D':'#2F6BFF'}">${L.face}극</b>이에요.</div>${done?`<button class="btn g switch" id="nx">${lv<2?'다음 단계 →':'미션 완료 →'}</button>`:''}`;
  const sw=$('#sw');sw.textContent=on?'⏻ 스위치 끄기':'⚡ 스위치 켜기';sw.classList.toggle('on',on);
  const nx=$('#nx');if(nx)nx.onclick=()=>{if(lv<2){lv++;dir=LV[lv].dir;on=false;tries=0;hint=false;done=false;sfx.click();say(lv===1?'이번엔 수레를 돌려놨어. 수레 쪽 면이 S극이야! 어떻게 하면 밀어낼까?':'마지막 단계! 이번엔 밀어내는 게 아니라 끌어당겨야 해.','happy');render();}else{badge('pole');finish('m7',30);}};}
 $('#sw').onclick=()=>{if(busy)return;setErr('');if(on){on=false;sfx.off();render();return;}
  on=true;busy=true;sfx.on();render();const L=LV[lv];const rp=dir>0?'N':'S';const repel=rp===L.face;
  tm=setTimeout(()=>{busy=false;const ok=(L.goal==='push')===repel;
   if(ok){done=true;sfx.snap();addCoins(tries===0&&!hint?15:5,tries===0&&!hint?'한 번에 성공':'퍼즐 성공');say(`성공! 전자석 오른쪽 끝이 ${rp}극이 됐어. 수레의 ${L.face}극과 ${repel?'같은 극이라 밀어냈어':'다른 극이라 끌어당겼어'}!`,'wow');}
   else{tries++;sfx.fail();say(`앗, 수레가 ${repel?'밀려났어':'끌려왔어'}! 전자석 끝이 ${rp}극이었나 봐. 스위치를 끄고 전지 방향을 바꿔 볼까?`,'worry');}
   render();},950);};
 $('#flip').onclick=()=>{if(busy)return;if(done){setErr('이미 성공했어요! 다음 단계로 가 보세요');return;}setErr('');on=false;dir=-dir;sfx.click();render();};
 $('#hb').onclick=()=>{sfx.click();hint=true;render();say('나침반을 전자석 끝에 대 봤어. 빨간 바늘(N)이 바깥쪽을 가리키면 전자석 끝은 N극, 전자석 쪽을 가리키면 S극이야!','happy');};
 cleanup=()=>clearTimeout(tm);
 dir=LV[0].dir;say('자석 수레가 있어! 전자석을 켜면 수레를 밀어낼 수도, 끌어당길 수도 있어. 전지 방향을 잘 정해서 켜 봐. 한 번에 성공하면 15코인!','happy');render();
}

/* ---------- 미션 8: 재활용 선별장 게임 ---------- */
const ITEMS={steel:{name:'철 캔',iron:true,h:38,svg:'<rect x="-14" y="-38" width="28" height="38" rx="4" fill="#9AA3B5" stroke="#1B2340" stroke-width="2"/><rect x="-14" y="-29" width="28" height="6" fill="#6B7591"/><rect x="-14" y="-15" width="28" height="6" fill="#6B7591"/>'},
 nail:{name:'철 못',iron:true,h:16,svg:'<rect x="-22" y="-11" width="44" height="7" rx="2" fill="#6B7591" stroke="#1B2340" stroke-width="1.6"/><rect x="-26" y="-16" width="7" height="16" rx="2" fill="#6B7591" stroke="#1B2340" stroke-width="1.6"/><path d="M22 -11 L30 -7.5 L22 -4Z" fill="#6B7591" stroke="#1B2340" stroke-width="1.4"/>'},
 alu:{name:'알루미늄 캔',eun:'알루미늄 캔은',iron:false,h:36,svg:'<rect x="-12" y="-36" width="24" height="36" rx="4" fill="#E6EBF3" stroke="#1B2340" stroke-width="2"/><rect x="-12" y="-25" width="24" height="10" fill="#2F6BFF"/>'},
 pet:{name:'페트병',eun:'페트병은',iron:false,h:44,svg:'<path d="M-5 -44 h10 v7 q10 6 10 14 v23 h-30 v-23 q0 -8 10 -14z" fill="#BDEBF7" stroke="#1B2340" stroke-width="2"/><rect x="-6" y="-47" width="12" height="5" fill="#1FA86B" stroke="#1B2340" stroke-width="1.5"/>'},
 paper:{name:'종이 상자',eun:'종이 상자는',iron:false,h:28,svg:'<rect x="-20" y="-28" width="40" height="28" fill="#D9A066" stroke="#1B2340" stroke-width="2"/><path d="M-20 -20 H20" stroke="#B07A3E" stroke-width="2"/>'}};
function m8(){
 let G=null,raf=0;
 app.innerHTML=`<div class="mhead"><span class="mtag">미션 8 · 미니게임</span><h1>재활용 선별장: 철만 골라내라!</h1></div><div id="say"></div>
 <div class="gamebar"><span>⏱️ <b id="gt">45</b>초</span><span>🔋</span><div class="ebar"><i id="ef" style="width:100%"></i></div><span>🧲 철 <b id="gs">0</b></span><span>😵 놓친 철 <b id="gm">0</b></span></div>
 <div class="stage" id="gstage"><svg viewBox="0 0 680 360" id="gsvg" role="img" aria-label="재활용 선별장 게임 화면"><rect width="680" height="360" fill="#EAF2FF"/><rect y="330" width="680" height="30" fill="#D9C9A8"/>
 <rect x="90" y="26" width="580" height="12" rx="4" fill="#FFC83D" stroke="#1B2340" stroke-width="2.5"/>
 <rect x="0" y="252" width="535" height="22" rx="6" fill="#3A4260" stroke="#1B2340" stroke-width="2.5"/>${[20,80,140,200,260,320,380,440,500].map(x=>`<circle cx="${x}" cy="263" r="6" fill="#8A93A8"/>`).join('')}<rect x="20" y="274" width="12" height="56" fill="#3A4260"/><rect x="500" y="274" width="12" height="56" fill="#3A4260"/>
 <rect x="560" y="220" width="104" height="110" rx="8" fill="#1FA86B" stroke="#1B2340" stroke-width="3"/><text x="612" y="290" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">철</text><text x="612" y="310" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">수거함</text>
 <g id="items"></g>
 <g id="crane"><rect x="-26" y="22" width="52" height="20" rx="5" fill="#1B2340"/><line x1="0" y1="42" x2="0" y2="120" stroke="#1B2340" stroke-width="3"/><ellipse id="glow" cx="0" cy="150" rx="46" ry="13" fill="#FFC83D" opacity="0"/><rect x="-36" y="120" width="72" height="24" rx="6" fill="#1B2340"/><rect x="-30" y="125" width="60" height="5" rx="2" fill="#5A6280"/></g>
 <g id="fx"></g></svg>
 <div class="overlay" id="gover"><div class="in"></div></div></div>
 <button class="btn y switch" id="mag">🧲 전자석 켜기</button>
 <div class="legend"><span>🟢 철이라서 붙어요: 철 캔(회색), 철 못</span><span>⚪ 안 붙어요: 알루미늄 캔(파란 띠), 페트병, 종이 상자</span><span>⌨️ 스페이스바로도 켜고 끌 수 있어요</span></div>`;
 const ov=$('#gover'),ovin=$('.in',ov);
 function intro(){ov.hidden=false;ovin.innerHTML=`${chuli('happy',80)}<h2>철이의 선별장 지키기</h2><p class="hint" style="font-size:16px">컨베이어 벨트 위로 쓰레기가 지나가요. 철이 자석 아래에 올 때 <b>전자석을 켜면</b> 철이 붙어요. 크레인이 수거함 위로 가면 <b>전자석을 꺼서</b> 떨어뜨리세요!<br>켜 둔 동안에는 배터리가 닳아요.</p><button class="btn y switch" id="gstart">게임 시작!</button>`;$('#gstart').onclick=start;}
 function start(){ac();sfx.click();$('#items').innerHTML='';$('#fx').innerHTML='';G={t:45,energy:100,on:false,items:[],spawn:.4,sorted:0,missed:0,crane:{x:200,state:'belt',item:null},last:performance.now(),over:false};ov.hidden=true;setMag(false);raf=requestAnimationFrame(loop);}
 function spawn(){const keys=Object.keys(ITEMS);const iron=Math.random()<.5;const pool=keys.filter(k=>ITEMS[k].iron===iron);const k=pool[Math.floor(Math.random()*pool.length)];const T=ITEMS[k];const el=document.createElementNS(NS,'g');el.innerHTML=T.svg;$('#items').appendChild(el);G.items.push({k,name:T.eun||T.name,iron:T.iron,h:T.h,x:-30,y:252,el,state:'belt'});}
 function fx(t,x,y,col){const e=document.createElementNS(NS,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('text-anchor','middle');e.setAttribute('font-size','17');e.setAttribute('font-weight','900');e.setAttribute('fill',col);e.setAttribute('class','fxup');e.textContent=t;$('#fx').appendChild(e);setTimeout(()=>e.remove(),950);}
 function setMag(v){if(!G)return;const c=G.crane;if(v===G.on)return;G.on=v;const b=$('#mag');b.textContent=v?'⏻ 전자석 끄기':'🧲 전자석 켜기';b.classList.toggle('on',v);
  if(v)sfx.on();else{sfx.off();if(c.item){const it=c.item;c.item=null;it.state='fall';it.vy=0;if(c.x>=572){it.ty=322;G.sorted++;fx('+1 철!',612,200,'#0E6B42');setTimeout(sfx.coin,250);}else{it.ty=it.x<535?252:330;it.lost=true;fx('떨어뜨렸어!',c.x,200,'#F0533D');if(it.ty===252)it.state='belt',it.y=252;}}if(c.state==='bin'||c.state==='toBin')c.state='toBelt';}}
 function step(dt){G.t-=dt;if(G.t<=0){G.t=0;return end('시간 끝!');}
  if(G.on){G.energy-=8*dt;if(G.energy<=0){G.energy=0;setMag(false);return end('배터리 방전!');}}
  const sp=85+(45-G.t)*1.4;G.spawn-=dt;if(G.spawn<=0){spawn();G.spawn=1.05+Math.random()*.75;}
  const c=G.crane;
  for(const it of G.items){
   if(it.state==='belt'){it.x+=sp*dt;
    if(it.x>548){it.state='gone';it.el.remove();if(it.iron){G.missed++;fx('놓쳤다!',520,226,'#F0533D');}}
    else if(G.on&&c.state==='belt'&&!c.item&&Math.abs(it.x-200)<30){if(it.iron){it.state='held';c.item=it;c.state='toBin';sfx.snap();}else if(!it.warned){it.warned=true;fx(it.name+' 안 붙어!',200,206,'#5A6280');}}}
   else if(it.state==='fall'){it.vy+=1100*dt;it.y+=it.vy*dt;if(it.y>=it.ty){it.y=it.ty;it.state='gone';const el=it.el;setTimeout(()=>el.remove(),250);if(!it.lost)sfx.drop();}}}
  G.items=G.items.filter(it=>it.state!=='gone');
  if(c.state==='toBin'){c.x=Math.min(612,c.x+520*dt);if(c.x>=612)c.state='bin';}
  else if(c.state==='toBelt'){c.x=Math.max(200,c.x-520*dt);if(c.x<=200)c.state='belt';}
  if(c.item){c.item.x=c.x;c.item.y=144+c.item.h;}}
 function draw(){if(!G)return;$('#crane').setAttribute('transform',`translate(${G.crane.x.toFixed(1)} 0)`);$('#glow').setAttribute('opacity',G.on?.85:0);for(const it of G.items)it.el.setAttribute('transform',`translate(${it.x.toFixed(1)} ${it.y.toFixed(1)})`);
  $('#gt').textContent=Math.ceil(G.t);$('#gs').textContent=G.sorted;$('#gm').textContent=G.missed;const ef=$('#ef');ef.style.width=G.energy.toFixed(0)+'%';ef.style.background=G.energy<30?'#F0533D':G.energy<60?'#FFC83D':'#1FA86B';}
 function loop(now){if(!G||G.over)return;const dt=Math.min(.05,(now-G.last)/1000);G.last=now;step(dt);draw();if(!G.over)raf=requestAnimationFrame(loop);}
 function end(why){G.over=true;cancelAnimationFrame(raf);if(G.on){G.on=false;const b=$('#mag');b.textContent='🧲 전자석 켜기';b.classList.remove('on');}draw();
  const sc=G.sorted;const best=sc>(S.bestSort||0);if(best){S.bestSort=sc;save();}if(sc>=6)badge('sorter');const pass=sc>=3;
  ov.hidden=false;ovin.innerHTML=`${chuli(pass?'wow':'worry',80)}<h2>${why}</h2><p style="font-size:20px;font-weight:800">골라낸 철 ${sc}개 · 놓친 철 ${G.missed}개${best?' · 🏆 최고 기록!':''}</p><p class="hint" style="font-size:15px">${pass?'선별장이 깨끗해졌어! 전자석은 켜면 철을 붙이고, 끄면 놓아줘서 이런 일에 딱이야.':'철 3개 이상 골라내면 미션 완료! 철이 자석 바로 아래에 왔을 때 켜 보세요.'}</p><div class="btnrow" style="justify-content:center"><button class="btn" id="again">다시 하기</button>${pass?'<button class="btn g" id="gfin">미션 완료 →</button>':''}</div>`;
  $('#again').onclick=start;const f=$('#gfin');if(f)f.onclick=()=>finish('m8',30);}
 $('#mag').onclick=()=>{if(!G||G.over)return;setMag(!G.on);};
 const key=e=>{if(e.code==='Space'&&G&&!G.over){e.preventDefault();setMag(!G.on);}};document.addEventListener('keydown',key);
 cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',key);if(G)G.over=true;};
 say('선별장에 쓰레기가 밀려들고 있어! 전자석 크레인으로 철만 골라내 줘. 알루미늄 캔은 자석에 붙을까? 직접 확인해 봐!','wow');intro();
}

/* ---------- 미션 10: 나의 가설 카드 ---------- */
const HYP=['전지를 2개로 늘리면 클립이 더 많이 붙을 것이다','에나멜선을 더 많이 감으면 클립이 더 많이 붙을 것이다','전지 방향을 바꾸면 나침반 바늘이 반대로 돌 것이다','볼트(철심)를 빼면 클립이 거의 붙지 않을 것이다','스위치를 끄면 붙어 있던 클립이 떨어질 것이다'];
function m10(){
 const picked=new Set(S.notes.hyp||[]);
 app.innerHTML=`<div class="mhead"><span class="mtag">미션 10 · 진짜 실험실로 출발</span><h1>나의 가설 카드 만들기</h1></div><div id="say"></div>
 <div class="grid2"><div><div class="card"><div class="lbl">🕰️ 미션 1에서 쓴 처음 내 생각</div><div class="quote">${esc(S.notes.first||'(기록 없음)')}</div><div class="lbl">💡 지금은 크레인의 비밀을 어떻게 설명할 수 있나요?</div><textarea id="now" rows="4" placeholder="크레인 끝에는 전자석이 있어서…">${esc(S.notes.now||'')}</textarea></div></div>
 <div><div class="card"><div class="lbl">🔬 실제 실험에서 확인할 가설 고르기 (2개 이상)</div><div id="hl">${HYP.map((t,i)=>`<button class="hypo ${picked.has(i)?'sel':''}" data-i="${i}">${t}</button>`).join('')}</div><div class="lbl" style="margin-top:10px">✏️ 나만의 가설 (선택)</div><input type="text" id="own" maxlength="60" placeholder="~하면 ~할 것이다" value="${esc(S.notes.own||'')}"></div></div></div>
 <div class="err" id="err"></div><button class="btn y switch" id="mk">🃏 가설 카드 만들기</button><div id="out" class="mt"></div>`;
 $$('.hypo').forEach(b=>b.onclick=()=>{sfx.click();const i=+b.dataset.i;picked.has(i)?picked.delete(i):picked.add(i);b.classList.toggle('sel');setErr('');});
 $('#now').addEventListener('input',()=>setErr(''));
 $('#mk').onclick=async()=>{const now=$('#now').value.trim();if(now.length<10){setErr('지금 내 설명을 조금 더 자세히 써 주세요 (10글자 이상)');shake($('#now'));return;}if(picked.size<2){setErr('확인할 가설을 2개 이상 골라 주세요');shake($('#hl'));return;}
  S.notes.now=now;S.notes.hyp=[...picked].sort();S.notes.own=$('#own').value.trim();save();sfx.click();
  const url=await drawCard();$('#out').innerHTML=`<div class="card"><div class="lbl">🎉 가설 카드 완성!</div><img src="${url}" alt="나의 가설 카드" style="width:100%;max-width:520px;display:block;margin:0 auto;border-radius:12px;border:2px solid var(--ink)"><div class="btnrow" style="justify-content:center"><a class="btn y" id="dl" href="${url}" download="가설카드_${esc(S.name)}.png" style="text-decoration:none">⬇️ 이미지 저장하기</a><button class="btn g" id="fin10">미션 완료 →</button></div><p class="hint" style="text-align:center">저장이 안 되면 그림을 길게 눌러 저장하세요. 저장한 그림은 웨일클래스에 제출해요.</p></div>`;
  $('#fin10').onclick=()=>{badge('hyp');finish('m10',40,'진짜 실험실에서 가설을 확인해 보자! 🔬');};
  $('#out').scrollIntoView({behavior:'smooth'});confetti();sfx.badge();};
 say('드디어 마지막 미션이야! 처음 생각과 지금 생각을 비교해 보고, 진짜 실험실에서 확인할 가설을 골라 줘. 앱 속 실험이 진짜로도 똑같을까?','happy');
}
function wrap(x,text,px,py,maxW,lh,maxLines){const chars=[...String(text)];let line='',lines=[];for(const ch of chars){if(ch==='\n'){lines.push(line);line='';continue;}const t=line+ch;if(x.measureText(t).width>maxW&&line){lines.push(line);line=ch.trim()?ch:'';}else line=t;}if(line)lines.push(line);if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}lines.forEach((l,i)=>x.fillText(l,px,py+i*lh));return py+lines.length*lh;}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
async function drawCard(){try{await document.fonts.ready;}catch(e){}
 const W=1080,H=2000,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');const F='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
 x.fillStyle='#FFF8EC';x.fillRect(0,0,W,H);x.save();rr(x,36,36,W-72,H,40);x.clip();x.fillStyle='#FFC83D';x.fillRect(36,36,W-72,240);x.restore();
 x.fillStyle='#1B2340';x.textBaseline='top';x.font=`800 34px ${F}`;x.fillText('⚡ 전자석 연구소 · 나의 가설 카드',80,76);x.font=`900 66px ${F}`;x.fillText(`${S.name} 연구원`,80,128);
 const d=new Date();x.font=`700 28px ${F}`;x.fillText(`${rank()} · 🪙 ${S.coins}코인 · 🏅 배지 ${S.badges.length}개 · ${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`,80,214);
 let y=316;const sec=(title,col)=>{x.fillStyle=col;rr(x,80,y,W-160,52,14);x.fill();x.fillStyle='#1B2340';x.font=`800 30px ${F}`;x.fillText(title,104,y+11);y+=72;};
 const body=(t,lines)=>{x.fillStyle='#1B2340';x.font=`600 30px ${F}`;y=wrap(x,t,96,y,W-192,44,lines)+22;};
 sec('🕰️ 처음 내 생각','#ECE6FF');body(S.notes.first||'-',3);
 sec('💡 지금 내 설명','#D9F5E8');body(S.notes.now||'-',4);
 sec('📐 내가 찾은 규칙','#E2EAFF');body('세기: '+(S.notes.ruleS||'-'),2);y-=8;body('극: '+(S.notes.ruleP||'-'),2);
 sec('🔬 진짜 실험에서 확인할 가설','#FFE3DD');
 const hs=(S.notes.hyp||[]).map(i=>HYP[i]);if(S.notes.own)hs.push(S.notes.own);
 hs.slice(0,6).forEach(t=>{x.strokeStyle='#1B2340';x.lineWidth=4;rr(x,96,y+2,34,34,6);x.stroke();x.fillStyle='#1B2340';x.font=`700 29px ${F}`;y=wrap(x,t,148,y,W-250,42,2);x.font=`500 24px ${F}`;x.fillStyle='#5A6280';x.fillText('실험 결과: ________________________________',148,y+2);y+=54;});
 const H2=Math.max(1200,y+150);const c2=document.createElement('canvas');c2.width=W;c2.height=H2;const z=c2.getContext('2d');z.drawImage(cv,0,0);
 rr(z,36,36,W-72,H2-72,40);z.lineWidth=8;z.strokeStyle='#1B2340';z.stroke();z.textBaseline='top';z.font=`600 24px ${F}`;z.fillStyle='#5A6280';z.fillText(`획득 배지  ${S.badges.map(b=>BADGES[b].icon).join(' ')||'-'}`,80,H2-110);
 return c2.toDataURL('image/png');}

const SCREENS={start:startScreen,map:mapScreen,m1,m2,m3:()=>labScreen('m3'),m4:()=>labScreen('m4'),m5,m6,m7,m8,m9:()=>labScreen('m9'),m10};
go(S.name?'map':'start');
</script>
